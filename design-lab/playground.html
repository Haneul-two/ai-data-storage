<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>토큰 조절판</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* 조절판 전용 1파일. tokens.css 변수를 슬라이더로 바꾸고 CSS 변수 블록을 복사한다 */
body{margin:0;background:var(--color-page);color:var(--color-ink);font-family:var(--font-body);line-height:var(--leading-body);display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{padding:var(--space-4);background:var(--color-surface);border-right:var(--border)}
label{display:grid;gap:var(--space-1);margin-bottom:var(--space-3);font-size:var(--text-sm)}
output{color:var(--color-muted)}
textarea{width:100%;height:150px;font:12px/1.4 monospace;border:var(--border);border-radius:var(--radius-sm)}
button{font:inherit;border:var(--border);border-radius:var(--radius-md);background:var(--color-surface);padding:var(--space-2) var(--space-4);min-height:var(--control)}
main{padding:var(--space-5);max-width:720px}
.card{background:var(--color-surface);border:var(--border);border-radius:var(--radius-lg);padding:var(--space-5);display:grid;gap:var(--space-3)}
.pill{justify-self:start;font-size:var(--text-xs);font-weight:700;padding:2px var(--space-3);border-radius:var(--radius-pill);background:var(--color-accent-soft);color:var(--color-accent-strong)}
.primary{justify-self:start;background:var(--color-accent);color:var(--color-on-accent);border-color:var(--color-accent)}
@media(max-width:760px){body{grid-template-columns:1fr}}
</style></head><body>
<aside>
<h1 style="font-size:var(--text-lg)">토큰 조절판</h1>
<label>강조색 (--color-accent) <input type="color" data-var="--color-accent" value="#245de8"></label>
<label>연한 강조 (--color-accent-soft) <input type="color" data-var="--color-accent-soft" value="#eaf0ff"></label>
<label>카드 간격 (--space-5) <output></output><input type="range" min="12" max="40" value="24" data-var="--space-5" data-unit="px"></label>
<label>반경 큼 (--radius-lg) <output></output><input type="range" min="0" max="28" value="14" data-var="--radius-lg" data-unit="px"></label>
<label>반경 중간 (--radius-md) <output></output><input type="range" min="0" max="20" value="10" data-var="--radius-md" data-unit="px"></label>
<button id="copy" type="button">CSS 변수 복사</button>
<p><textarea id="out" readonly aria-label="변경된 CSS 변수"></textarea></p>
</aside>
<main><div class="card"><span class="pill">공모전</span><h2 style="margin:0">샘플 항목 (가짜)</h2><p style="margin:0;color:var(--color-muted)">값을 바꾸면 이 카드에 바로 반영됩니다.</p><button class="primary" type="button">상세 보기</button></div></main>
<script>
const root = document.documentElement, out = document.getElementById('out');
function sync() {
  const lines = [];
  document.querySelectorAll('[data-var]').forEach((el) => {
    const v = el.value + (el.dataset.unit || '');
    root.style.setProperty(el.dataset.var, v);
    if (el.previousElementSibling && el.previousElementSibling.tagName === 'OUTPUT') el.previousElementSibling.textContent = v;
    lines.push(`  ${el.dataset.var}: ${v};`);
  });
  out.value = `:root {\n${lines.join('\n')}\n}`;
}
document.querySelectorAll('[data-var]').forEach((el) => el.addEventListener('input', sync));
document.getElementById('copy').addEventListener('click', () => navigator.clipboard && navigator.clipboard.writeText(out.value));
sync();
</script></body></html>
