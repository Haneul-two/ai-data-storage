<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 1 — 컴팩트 행</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* 시안 전용 1파일 스타일. 값은 tokens.css 토큰만 사용. 문구는 모두 가짜 샘플 */
body{margin:0;background:var(--color-page);color:var(--color-ink);font-family:var(--font-body);line-height:var(--leading-body)}
.wrap{max-width:var(--layout-max);margin:0 auto;padding:var(--space-5) var(--space-6)}
.note{color:var(--color-muted);font-size:var(--text-sm)}
h1{font-size:var(--text-xl);margin:var(--space-2) 0 var(--space-4)}
.grid{display:grid;grid-template-columns:var(--rail-filter) 1fr;gap:var(--space-5)}
.rail,.row{background:var(--color-surface);border:var(--border);border-radius:var(--radius-md)}
.rail{padding:var(--space-4);height:fit-content}
.rail b{display:block;font-size:var(--text-sm);color:var(--color-muted);margin:var(--space-2) 0}
.rail span{display:block;padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);font-size:var(--text-sm)}
.rail .on{background:var(--color-accent-soft);color:var(--color-accent-strong);font-weight:700}
.row{display:grid;grid-template-columns:90px 1fr 150px 150px 90px;gap:var(--space-4);align-items:center;padding:var(--space-3) var(--space-4);margin-bottom:var(--space-2)}
.pill{font-size:var(--text-xs);font-weight:700;padding:2px var(--space-3);border-radius:var(--radius-pill);background:var(--color-kind-hackathon-soft);color:var(--color-kind-hackathon);justify-self:start}
.t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.s{font-size:var(--text-xs);color:var(--color-muted)}
.btn{border:var(--border);background:var(--color-surface);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);font:inherit;font-size:var(--text-sm)}
</style></head><body><div class="wrap">
<p class="note">시안 1 / 3 — 한 화면에 가장 많이 훑어보기. 행 높이 약 64px, 마감·개최를 열로 정렬. (샘플 문구는 가짜입니다)</p>
<h1>다음 도전을 찾아보세요</h1>
<div class="grid"><aside class="rail"><b>진행 상태</b><span class="on">전체</span><span>모집중</span><span>예정</span><b>방식</b><span class="on">전체</span><span>온라인</span></aside>
<main>
<div class="row"><span class="pill">해커톤</span><div><div class="t">샘플 항목 A</div><div class="s">샘플 주최 · 온라인</div></div><div><div class="s">접수 마감</div>2026.10.27 (화)</div><div><div class="s">개최</div>10.28 – 11.20</div><button class="btn">상세</button></div>
<div class="row"><span class="pill">해커톤</span><div><div class="t">샘플 항목 B</div><div class="s">샘플 주최 · 서울</div></div><div><div class="s">접수 마감</div>2026.10.30 (금)</div><div><div class="s">개최</div>11.05</div><button class="btn">상세</button></div>
<div class="row"><span class="pill">해커톤</span><div><div class="t">샘플 항목 C</div><div class="s">샘플 주최 · 혼합</div></div><div><div class="s">접수 마감</div>미확인</div><div><div class="s">개최</div>미확인</div><button class="btn">상세</button></div>
</main></div></div></body></html>
