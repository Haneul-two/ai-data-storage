<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 2 — 편안한 탐색 (현재 채택안)</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* 시안 전용 1파일 스타일. 문구는 모두 가짜 샘플 */
body{margin:0;background:var(--color-page);color:var(--color-ink);font-family:var(--font-body);line-height:var(--leading-body)}
.wrap{max-width:var(--layout-max);margin:0 auto;padding:var(--space-5) var(--space-6)}
.note{color:var(--color-muted);font-size:var(--text-sm)}
h1{font-size:var(--text-title);margin:var(--space-4) 0 var(--space-5)}
.grid{display:grid;grid-template-columns:var(--rail-filter) 1fr var(--rail-urgent);gap:var(--space-6)}
.rail,.card{background:var(--color-surface);border:var(--border);border-radius:var(--radius-lg)}
.rail{padding:var(--space-4);height:fit-content;font-size:var(--text-sm)}
.card{padding:var(--space-5);margin-bottom:var(--space-3);display:grid;grid-template-columns:1fr auto;gap:var(--space-4)}
.card h3{margin:var(--space-2) 0;font-size:var(--text-xl)}
.pill{font-size:var(--text-xs);font-weight:700;padding:2px var(--space-3);border-radius:var(--radius-pill);background:var(--color-kind-contest-soft);color:var(--color-kind-contest)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);border-top:var(--border);margin-top:var(--space-3);padding-top:var(--space-3);font-weight:600}
.dates small{display:block;color:var(--color-muted);font-weight:400}
.btn{border:0;background:var(--color-accent);color:var(--color-on-accent);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font:inherit;font-weight:600;height:fit-content}
</style></head><body><div class="wrap">
<p class="note">시안 2 / 3 — 편안한 탐색: 큰 제목, 넓은 행, 오른쪽 마감 임박 레일. 현재 index.html이 이 구조입니다. (샘플 문구는 가짜입니다)</p>
<h1>다음 도전을 찾아보세요</h1>
<div class="grid"><aside class="rail"><b>진행 상태</b><p>전체 · 모집중 · 예정</p><b>참가 방식</b><p>전체 · 온라인</p></aside>
<main>
<article class="card"><div><span class="pill">공모전</span><h3>샘플 항목 A</h3><div class="note">샘플 주최</div><div class="dates"><div><small>접수 마감</small>2026.10.27 (화)</div><div><small>개최 일정</small>미확인</div></div></div><button class="btn">상세 보기</button></article>
<article class="card"><div><span class="pill">공모전</span><h3>샘플 항목 B</h3><div class="note">샘플 주최</div><div class="dates"><div><small>접수 마감</small>2026.10.30 (금)</div><div><small>개최 일정</small>11.05 – 11.06</div></div></div><button class="btn">상세 보기</button></article>
</main><aside class="rail"><b>마감 임박</b><p>샘플 A · D-25</p><p>샘플 B · D-28</p></aside></div></div></body></html>
